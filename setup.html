<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRK Test setup</title><link rel="stylesheet" href="style.css"><main class="setup"><h1>Connect Google Sheets</h1><p>Paste the deployed Google Apps Script Web App URL ending in /exec. This URL is a public read-only endpoint for published content.</p><label>Apps Script URL<input id="endpoint" placeholder="https://script.google.com/macros/s/…/exec"></label><button id="save">Connect and open site</button><p id="message"></p><p>This saves the connection in this browser. For all visitors, put it in config.json.</p><a href="README.md">Setup instructions</a></main><script type="module">document.querySelector('#save').onclick=()=>{const value=document.querySelector('#endpoint').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(value)){document.querySelector('#message').textContent='Use the deployed /exec URL.';return}localStorage.setItem('mrk-test-endpoint',value);location.href='index.html'};</script></html>
